        :root {
            --primary-color: #2c3e50;
            --accent-color: #8e44ad;

            --bg-color: #fdfaf6;

        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-color); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin: 0; padding: 12px; touch-action: manipulation;
            min-height: 100vh;
        }

        #game-box { 
            background: #fff; padding: 18px; border-radius: 16px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); 
            text-align: center; width: 100%; max-width: 420px;
            border: 1px solid #eee;
        }

        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 12px; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px;
        }
        
        h1 { font-size: 1.15rem; color: var(--primary-color); margin: 0; }

        .score-board { display: flex; gap: 8px; font-size: 0.85rem; font-weight: bold; }
        .score-correct { color: var(--success-color); }
        .score-wrong { color: var(--error-color); }
        
        .meaning-box {
            background: #f8f9fa; border-left: 4px solid var(--accent-color);
            padding: 12px; margin: 12px 0; text-align: left; min-height: 75px;
            display: flex; flex-direction: column; justify-content: center;
            border-radius: 0 8px 8px 0;
        }

        .meaning { font-size: 0.98rem; font-weight: bold; color: #2f3640; line-height: 1.35; margin-bottom: 4px; }
        .source { font-size: 0.75rem; color: #95a5a6; }
        
        .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
        .slot { 
            border-bottom: 3px solid #ddd; height: 60px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; color: #2c3e50;
            font-family: var(--brush-font);
            font-weight: 900;
            background: #fafafa; border-radius: 4px 4px 0 0;
            position: relative; overflow: hidden;
        }
        
        .slot svg {
            width: 52px !important;
            height: 52px !important;
        }

        .cards { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .card-wrapper { position: relative; }
        .card { 
            width: 60px; height: 60px; background: var(--primary-color); color: white;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 1.9rem; 
            font-family: var(--brush-font);
            font-weight: 900;
            cursor: pointer; box-shadow: 0 4px 0 #1a252f;
            user-select: none; -webkit-user-select: none;
        }
        .card:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1a252f;
        }

        .tooltip { 
            position: absolute; bottom: 105%; left: 50%; transform: translateX(-50%);
            background: #34495e; color: white; padding: 3px 6px; border-radius: 4px;
            font-size: 0.7rem; white-space: nowrap; visibility: hidden; opacity: 0;
            transition: opacity 0.2s; z-index: 10; pointer-events: none;
        }
        .card-wrapper:active .tooltip,
        .card-wrapper:hover .tooltip { visibility: visible; opacity: 1; }
        
        #message { font-weight: bold; margin-bottom: 12px; min-height: 2.2em; font-size: 0.9rem; color: #7f8c8d; line-height: 1.3; }
        
        .btn-next { 
            width: 100%; padding: 13px; background: var(--accent-color); color: white;
            border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 3px 0 #6c3483;
        }
        .btn-next:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #6c3483;
        }

</head>

        ["吳越同舟", "오월동주", "나라 오/나라 월/한가지 동/배 주", "적대 관계에 있는 사람들이 같은 처지에 놓임", "손자"],
        ["外柔內剛", "외유내강", "바깥 외/부드러울 유/안 내/강할 강", "겉으로는 부드러우나 속은 강함", "진서"]
    ];

    let quizData = [];
    try {
        quizData = rawData.map(item => {
            const hanja = item[0];
            const read = item[1];
            const infoChars = item[2].split('/');
            const meaning = item[3];
            const source = item[4];
            
            const info = [];
            for(let i = 0; i < 4; i++) {
                info.push([hanja[i] || "", infoChars[i] || ""]);
            }
            return { hanja, info, meaning, read, source: `출처: ${source}` };
        });
    } catch(e) {
        console.error("Data error:", e);
    }

    let currentIdx = -1;
    let selectedHanja = "";
    let correctCount = 0;
    let wrongCount = 0;
    let isAnswered = false;

    function nextQuiz() {
        if (!quizData || quizData.length === 0) return;

        let nextIdx;
        do { nextIdx = Math.floor(Math.random() * quizData.length); } while (nextIdx === currentIdx && quizData.length > 1);
        currentIdx = nextIdx;
        const quiz = quizData[currentIdx];
        selectedHanja = "";
        isAnswered = false;
        
        document.getElementById('meaning').innerText = quiz.meaning;
        document.getElementById('source').innerText = "출처 확인을 위해 정답을 맞춰보세요!";
        document.getElementById('message').innerText = "순서대로 한자를 선택하세요.";
        document.getElementById('message').style.color = "#7f8c8d";
        
        for(let i=0; i<4; i++) {
            const slot = document.getElementById(`slot-${i}`);
            slot.innerHTML = "";
            slot.style.color = "#2c3e50"; 
            slot.style.borderBottomColor = "#ddd"; 
        }

        const shuffledInfo = [...quiz.info].sort(() => Math.random() - 0.5);
        const cardContainer = document.getElementById('cards');
        cardContainer.innerHTML = "";
        
        shuffledInfo.forEach(item => {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            
            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip';
            tooltip.innerText = item[1]; 
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerText = item[0]; 
            card.onclick = () => selectCard(card, item[0]);
            
            wrapper.appendChild(tooltip);
            wrapper.appendChild(card);
            cardContainer.appendChild(wrapper);
        });
    }

    function selectCard(cardElement, char) {
        if (selectedHanja.length >= 4 || isAnswered) return;
        const currentSlot = document.getElementById(`slot-${selectedHanja.length}`);
        currentSlot.innerHTML = `<span style="font-family: var(--brush-font); font-weight: 900;">${char}</span>`;
        selectedHanja += char;
        cardElement.style.visibility = 'hidden';

        if (selectedHanja.length === 4) checkAnswer();
    }

    function animateSingleChar(slotId, char, strokeColor) {
        return new Promise((resolve) => {
            const slotEl = document.getElementById(slotId);
            slotEl.innerHTML = "";

            const renderBrushText = () => {
                slotEl.innerHTML = `<span style="font-family: var(--brush-font); color: ${strokeColor}; font-weight: 900; line-height: 60px;">${char}</span>`;
            };

            if (typeof HanziWriter === 'undefined') {
                renderBrushText();
                return resolve();
            }

            let isFinished = false;

            const timeoutId = setTimeout(() => {
                if (!isFinished) {
                    isFinished = true;
                    renderBrushText();
                    resolve();
                }
            }, 1500);

            try {
                const writer = HanziWriter.create(slotId, char, {
                    width: 52,
                    height: 52,
                    padding: 2,
                    showOutline: false,
                    strokeColor: strokeColor,
                    strokeAnimationSpeed: 2.2,
                    delayBetweenStrokes: 10,
                    onLoadCharDataError: function() {
                        if (!isFinished) {
                            isFinished = true;
                            clearTimeout(timeoutId);
                            renderBrushText();
                            resolve();
                        }
                    }
                });

                writer.animateCharacter({
                    onComplete: function() {
                        if (!isFinished) {
                            isFinished = true;
                            clearTimeout(timeoutId);
                            renderBrushText();
                            resolve();
                        }
                    }
                });
            } catch (err) {
                if (!isFinished) {
                    isFinished = true;
                    clearTimeout(timeoutId);
                    renderBrushText();
                    resolve();
                }
            }
        });
    }

    async function animateHanja(targetHanja, strokeColor) {
        for (let i = 0; i < 4; i++) {
            await animateSingleChar(`slot-${i}`, targetHanja[i], strokeColor);
        }
    }

    async function checkAnswer() {
        if (isAnswered) return;
        isAnswered = true;

        const quiz = quizData[currentIdx];
        const msg = document.getElementById('message');
        const src = document.getElementById('source');
        
        src.innerText = quiz.source;

        if (selectedHanja === quiz.hanja) {
            correctCount++;
            document.getElementById('correct-count').innerText = correctCount;
            msg.innerHTML = `<span style="color:var(--success-color)">✨ 정답: ${quiz.read}</span><br>완벽합니다! (획순 쓰는 중...)`;
            
            for(let i=0; i<4; i++) {
                document.getElementById(`slot-${i}`).style.borderBottomColor = "var(--success-color)";
            }
            
            await animateHanja(quiz.hanja, '#27ae60');
            msg.innerHTML = `<span style="color:var(--success-color)">✨ 정답: ${quiz.read}</span><br>완벽합니다!`;

        } else {
            wrongCount++;
            document.getElementById('wrong-count').innerText = wrongCount;
            msg.innerHTML = `<span style="color:var(--error-color)">❌ 오답입니다.</span><br>정답: ${quiz.hanja} (${quiz.read})`;
            
            for(let i=0; i<4; i++) {
                const s = document.getElementById(`slot-${i}`);
                s.style.color = "var(--error-color)";
                s.style.borderBottomColor = "var(--error-color)";
            }

            setTimeout(async () => {
                msg.innerHTML = `<span style="color:var(--error-color)">❌ 정답 획순 보기</span><br>정답: ${quiz.hanja} (${quiz.read})`;
                await animateHanja(quiz.hanja, '#e74c3c');
            }, 500);
        }
    }

    window.onload = function() {
        nextQuiz();
    };
</script>

</body>
